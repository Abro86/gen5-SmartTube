name: Build fork candidate
on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Stable SmartTube tag (blank checks latest)
        required: false
        default: ''
      revision:
        description: Fork revision, 51-99
        required: false
        default: '51'
  schedule:
    - cron: '23 15 * * 2,5'
permissions:
  contents: read
concurrency:
  group: fork-release
  cancel-in-progress: false
env:
  APKTOOL_VERSION: '2.12.0'
  APKTOOL_SHA256: effb69dab2f93806cafc0d232f6be32c2551b8d51c67650f575e46c016908fdd
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      needed: ${{ steps.prepare.outputs.needed }}
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test fork contract
        run: python3 -m unittest discover -s tests -v
      - name: Select upstream and check port changes
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          INPUT_REVISION: ${{ inputs.revision }}
        run: python3 tools/prepare_release.py
      - name: Install build tools
        if: steps.prepare.outputs.needed == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/apktool.jar" "https://github.com/iBotPeaches/Apktool/releases/download/v$APKTOOL_VERSION/apktool_$APKTOOL_VERSION.jar"
          echo "$APKTOOL_SHA256  $RUNNER_TEMP/bin/apktool.jar" | sha256sum -c -
          printf '#!/bin/sh\nexec java -jar "%s" "$@"\n' "$RUNNER_TEMP/bin/apktool.jar" > "$RUNNER_TEMP/bin/apktool"
          chmod +x "$RUNNER_TEMP/bin/apktool"
          echo "APKTOOL=$RUNNER_TEMP/bin/apktool" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0' > /dev/null
      - name: Download verified upstream APK
        if: steps.prepare.outputs.needed == 'true'
        id: apk
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.prepare.outputs.upstream_tag }}
        run: echo "path=$(tools/fetch-upstream.sh "$UPSTREAM_TAG")" >> "$GITHUB_OUTPUT"
      - name: Build, sign and verify APK
        if: steps.prepare.outputs.needed == 'true'
        env:
          SMARTTUBE_KEYSTORE_B64: ${{ secrets.SMARTTUBE_KEYSTORE_B64 }}
          SMARTTUBE_KEY_PASS: ${{ secrets.SMARTTUBE_KEY_PASS }}
          UPSTREAM_APK: ${{ steps.apk.outputs.path }}
          FORK_REVISION: ${{ steps.prepare.outputs.revision }}
        run: |
          [ -n "$SMARTTUBE_KEYSTORE_B64" ] && [ -n "$SMARTTUBE_KEY_PASS" ] || { echo '::error::Fork signing secrets required'; exit 1; }
          export SMARTTUBE_KEYSTORE=$RUNNER_TEMP/key/smarttube.jks
          mkdir -m 700 "$RUNNER_TEMP/key"
          trap 'rm -rf "$RUNNER_TEMP/key"' EXIT
          base64 -d <<< "$SMARTTUBE_KEYSTORE_B64" > "$SMARTTUBE_KEYSTORE"
          ./build.sh "$UPSTREAM_APK" "$FORK_REVISION"
          cp build-provenance.json dist/
          (cd dist && sha256sum *.zip *.apk *.json > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        if: steps.prepare.outputs.needed == 'true'
        with:
          name: fork-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 30
  draft:
    needs: build
    if: needs.build.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: fork-candidate
          path: dist
      - name: Save draft for vehicle validation
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_TAG: ${{ needs.build.outputs.tag }}
          FORK_VERSION: ${{ needs.build.outputs.version }}
        run: |
          cat > notes.txt <<'EOF'
          Abro86's Gen5W SmartTube fork. Omits the application-level Park restriction; retains Gen5W compatibility fixes. Do not watch or operate video while driving.

          Automated build checks passed. Vehicle playback, audio routing and preservation of other plugins remain untested. This is a draft candidate, not a vehicle-validated release.

          Requires NEMESIS 1.16+ and media.codecs 2.1+. The NEMESIS ID is local.abro.smarttube; do not co-install another SmartTube package. Switching signing keys can reset SmartTube settings/sign-in. Subsequent fork builds use the same key.

          Install through NEMESIS after backups and current protected-session validation. No automatic car install. Verify SHA256SUMS. Source/APK provenance is in build-provenance.json.
          EOF
          gh release create "$FORK_TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "SmartTube $FORK_VERSION - Abro fork candidate" --notes-file notes.txt dist/*
